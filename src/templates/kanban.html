<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Tracker — Kanban</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e2e2e6;
    --text: #1d1d1f;
    --muted: #6b6b74;
    --accent: #3457d5;
    --col-bg: #eeeef1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card: #1f1f24;
      --border: #303038;
      --text: #eaeaef;
      --muted: #9a9aa5;
      --accent: #6f8dff;
      --col-bg: #1b1b20;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .stats { color: var(--muted); font-size: 13px; }
  .goal-badge { color: var(--muted); font-size: 13px; }
  .goal-badge.goal-met { color: #2e9e4f; font-weight: 600; }
  nav.view-nav { display: flex; gap: 4px; }
  nav.view-nav a {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    text-decoration: none;
    color: var(--muted);
  }
  nav.view-nav a.active { background: var(--accent); color: #fff; }
  nav.view-nav a:not(.active):hover { background: var(--bg); }
  .controls {
    padding: 14px 28px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  input[type="search"], input[type="date"] {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
  }
  input[type="search"] {
    flex: 1;
    min-width: 200px;
  }
  .date-filter { display: flex; align-items: center; gap: 6px; }
  .date-filter span { color: var(--muted); font-size: 13px; }
  main {
    padding: 20px 28px 40px;
    overflow-x: auto;
  }
  .board {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    min-height: 60vh;
  }
  .column {
    background: var(--col-bg);
    border-radius: 10px;
    width: 260px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 180px);
  }
  .column-header {
    padding: 12px 14px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
  }
  .column-count {
    background: var(--card);
    color: var(--muted);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 600;
  }
  .column-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 40px;
  }
  .column-body.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 8px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    cursor: grab;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card .company {
    font-weight: 600;
    color: var(--text);
    display: block;
    margin-bottom: 2px;
    text-decoration: none;
  }
  .card .company:hover { color: var(--accent); }
  .card .title { color: var(--muted); font-size: 12px; display: block; margin-bottom: 4px; }
  .card .meta { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 6px; }
  .empty-col { color: var(--muted); font-size: 12px; padding: 10px 4px; text-align: center; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  .modal-backdrop.hidden { display: none; }
  .modal-panel {
    background: var(--card);
    border-radius: 12px;
    width: 100%;
    max-width: 520px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    padding: 20px 22px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .modal-head h2 { font-size: 16px; margin: 0 0 2px; }
  .company-row { display: flex; align-items: center; gap: 6px; }
  .company-editable {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    cursor: text;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .company-editable:hover { outline: 1px dashed var(--accent); }
  .company-editable:focus { outline: 2px solid var(--accent); }
  a.company-link-icon { color: var(--accent); text-decoration: none; font-size: 14px; }
  a.company-link-icon:hover { text-decoration: underline; }
  .modal-subtitle { color: var(--muted); font-size: 12px; }
  .delete-job-btn {
    background: none;
    border: 1px solid #d9534f;
    color: #d9534f;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .delete-job-btn:hover { background: #d9534f; color: #fff; }
  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .modal-close:hover { background: var(--bg); color: var(--text); }
  .modal-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .modal-field label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .modal-field .editable, .modal-field select {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    min-height: 16px;
  }
  .modal-field .editable[data-field="notes"], .modal-field .editable[data-field="job_summary"] {
    white-space: pre-wrap;
    min-height: 90px;
    max-height: 260px;
    overflow-y: auto;
  }
  .modal-field .editable:focus, .modal-field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .saved-flash { animation: flash 0.6s ease; }
  @keyframes flash { from { background: #d9f5df; } to { background: var(--bg); } }
  .markdown-field-header { display: flex; justify-content: space-between; align-items: center; }
  .markdown-rendered { white-space: normal; line-height: 1.4; }
  .markdown-rendered p { margin: 0 0 8px; }
  .markdown-rendered p:last-child { margin-bottom: 0; }
  .markdown-rendered ul { margin: 0 0 8px; padding-left: 20px; }
  .markdown-rendered h4 { margin: 10px 0 4px; font-size: 13px; }
  .markdown-rendered code { background: rgba(127,127,127,0.15); padding: 1px 4px; border-radius: 3px; }
  .modal-field .editable.markdown-rendered:not(.expanded) {
    max-height: 4.2em;
    overflow: hidden;
    position: relative;
  }
  .modal-field .editable.markdown-rendered:not(.expanded)::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 1.4em;
    background: linear-gradient(to bottom, transparent, var(--bg));
  }
  .markdown-expand-btn { align-self: flex-start; padding-left: 0; }
  textarea.markdown-raw {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
  }

  .modal-field input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    width: 100%;
  }
  .non-date-value {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--bg);
    font-size: 13px;
  }
  .non-date-value .raw-text { flex: 1; color: var(--text); }
  .non-date-value button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--accent);
    font-size: 11px;
    padding: 3px 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .non-date-value button:hover { background: var(--card); }
  .followup-field {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .followup-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 6px 3px 10px;
    font-size: 12px;
  }
  .followup-chip.non-date { color: var(--muted); font-style: italic; }
  .followup-chip button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 999px;
  }
  .followup-chip button:hover { background: var(--card); color: var(--text); }
  .followup-add {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .followup-add input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
  }
  .followup-add button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--accent);
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .followup-add button:hover { background: var(--card); }
  .followup-add button:disabled { opacity: 0.4; cursor: not-allowed; }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button.primary:hover { opacity: 0.9; }
  button.linklike {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 7px 4px;
  }
  .modal-field input[type="text"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .modal-error { color: #d64545; font-size: 12px; margin-bottom: 10px; display: none; }
</style>
</head>
<body>
<header>
  <h1>Job Tracker</h1>
  <nav class="view-nav">
    <a href="/">Table</a>
    <a href="/kanban" class="active">Kanban</a>
    <a href="/insights">Insights</a>
  </nav>
  <div class="stats" id="stats"></div>
  <div class="goal-badge" id="goalBadge"></div>
</header>
<div class="controls">
  <input type="search" id="search" placeholder="Search company, title, notes…">
  <div class="date-filter">
    <input type="date" id="dateFrom" title="Added from">
    <span>–</span>
    <input type="date" id="dateTo" title="Added to">
    <button class="linklike" id="filterToday">Today</button>
    <button class="linklike" id="filterWeek">This Week</button>
    <button class="linklike" id="filterClearDates">Clear</button>
  </div>
  <button class="linklike" id="exportCsvBtn">Export CSV</button>
  <button class="primary" id="addJobBtn">+ Add Job</button>
</div>
<main>
  <div class="board" id="board"></div>
</main>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal-panel" id="modalPanel"></div>
</div>

<script>
const STATUS_VALUES = {{ status_values | tojson }};
// Blank status becomes its own "Not Tracked" column, placed first.
const COLUMNS = ["", ...STATUS_VALUES.filter(s => s !== "")];
const COLUMN_LABELS = { "": "Not Tracked" };

let allJobs = [];

async function loadJobs() {
  const res = await fetch('/api/jobs');
  allJobs = await res.json();
  render();
}

function rowKey(job) {
  return `${job.company}::${job.date_added}::${job.position_title || ''}::${job.link || ''}`;
}

function localISODate(d) {
  const yr = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const da = String(d.getDate()).padStart(2, '0');
  return `${yr}-${mo}-${da}`;
}

function startOfWeekISO(d) {
  const copy = new Date(d);
  copy.setDate(copy.getDate() - copy.getDay());
  return localISODate(copy);
}

function renderMarkdownInto(container, raw) {
  container.innerHTML = '';
  const lines = (raw || '').split('\n');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*$/.test(line)) { i++; continue; }
    const heading = /^#{1,6}\s+(.*)$/.exec(line);
    if (heading) {
      const h = document.createElement('h4');
      appendInlineMarkdown(h, heading[1]);
      container.appendChild(h);
      i++;
      continue;
    }
    if (/^[-*]\s+/.test(line)) {
      const ul = document.createElement('ul');
      while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
        const li = document.createElement('li');
        appendInlineMarkdown(li, lines[i].replace(/^[-*]\s+/, ''));
        ul.appendChild(li);
        i++;
      }
      container.appendChild(ul);
      continue;
    }
    const para = document.createElement('p');
    let first = true;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^[-*]\s+/.test(lines[i]) && !/^#{1,6}\s+/.test(lines[i])) {
      if (!first) para.appendChild(document.createElement('br'));
      appendInlineMarkdown(para, lines[i]);
      first = false;
      i++;
    }
    container.appendChild(para);
  }
  if (!container.childNodes.length) {
    const empty = document.createElement('p');
    empty.className = 'markdown-empty';
    empty.textContent = '(empty)';
    container.appendChild(empty);
  }
}

function appendInlineMarkdown(parent, text) {
  const tokenRe = /(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)]+\))/g;
  let lastIndex = 0;
  let m;
  while ((m = tokenRe.exec(text)) !== null) {
    if (m.index > lastIndex) parent.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
    const token = m[0];
    if (token.startsWith('**')) {
      const strong = document.createElement('strong');
      strong.textContent = token.slice(2, -2);
      parent.appendChild(strong);
    } else if (token.startsWith('`')) {
      const code = document.createElement('code');
      code.textContent = token.slice(1, -1);
      parent.appendChild(code);
    } else {
      const linkMatch = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(token);
      if (linkMatch && /^https?:\/\//i.test(linkMatch[2])) {
        const a = document.createElement('a');
        a.href = linkMatch[2];
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = linkMatch[1];
        parent.appendChild(a);
      } else {
        parent.appendChild(document.createTextNode(token));
      }
    }
    lastIndex = tokenRe.lastIndex;
  }
  if (lastIndex < text.length) parent.appendChild(document.createTextNode(text.slice(lastIndex)));
}

function checkMarkdownOverflow(rendered, expandBtn) {
  if (rendered.classList.contains('expanded')) { return; }
  const overflowing = rendered.scrollHeight > rendered.clientHeight + 1;
  expandBtn.style.display = overflowing ? 'inline-block' : 'none';
}

function refreshMarkdownFields(scope) {
  scope.querySelectorAll('.markdown-field').forEach(el => {
    if (typeof el._checkOverflow === 'function') el._checkOverflow();
  });
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  const filtered = allJobs.filter(j => {
    if (dateFrom && (j.date_added || '') < dateFrom) return false;
    if (dateTo && (j.date_added || '') > dateTo) return false;
    if (!q) return true;
    const haystack = [j.company, j.position_title, j.notes, j.location].join(' ').toLowerCase();
    return haystack.includes(q);
  });

  document.getElementById('stats').textContent = `${filtered.length} of ${allJobs.length} jobs`;

  const DAILY_GOAL = 5;
  const todayStr = localISODate(new Date());
  const appliedToday = allJobs.filter(j => j.status === 'Applied' && (j.date_applied || '') === todayStr).length;
  const goalBadge = document.getElementById('goalBadge');
  goalBadge.textContent = `Applied today: ${appliedToday} / ${DAILY_GOAL}`;
  goalBadge.classList.toggle('goal-met', appliedToday >= DAILY_GOAL);

  const board = document.getElementById('board');
  board.innerHTML = '';

  for (const status of COLUMNS) {
    const jobsInColumn = filtered.filter(j => (j.status || '') === status);

    const column = document.createElement('div');
    column.className = 'column';
    column.dataset.status = status;

    const headerEl = document.createElement('div');
    headerEl.className = 'column-header';
    const label = document.createElement('span');
    label.textContent = COLUMN_LABELS[status] || status;
    const count = document.createElement('span');
    count.className = 'column-count';
    count.textContent = jobsInColumn.length;
    headerEl.appendChild(label);
    headerEl.appendChild(count);
    column.appendChild(headerEl);

    const body = document.createElement('div');
    body.className = 'column-body';
    body.dataset.status = status;

    if (jobsInColumn.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-col';
      empty.textContent = 'No jobs';
      body.appendChild(empty);
    }

    for (const job of jobsInColumn) {
      body.appendChild(makeCard(job));
    }

    addDropHandlers(body);
    column.appendChild(body);
    board.appendChild(column);
  }
}

function makeCard(job) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.key = rowKey(job);

  const company = document.createElement(job.link ? 'a' : 'span');
  company.className = 'company';
  company.textContent = job.company;
  if (job.link) {
    company.href = job.link;
    company.target = '_blank';
    company.rel = 'noopener noreferrer';
  }
  card.appendChild(company);

  const title = document.createElement('span');
  title.className = 'title';
  title.textContent = job.position_title || '';
  card.appendChild(title);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const loc = document.createElement('span');
  loc.textContent = job.location || '';
  const date = document.createElement('span');
  date.textContent = job.date_added || '';
  meta.appendChild(loc);
  meta.appendChild(date);
  card.appendChild(meta);

  let didDrag = false;
  card.addEventListener('dragstart', (e) => {
    didDrag = true;
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', card.dataset.key);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));
  card.addEventListener('click', () => {
    if (didDrag) {
      didDrag = false;
      return;
    }
    openModal(job);
  });

  return card;
}

// /api/jobs no longer ships job_summary -- it was two thirds of the payload and
// nothing on the board displays it. The modal is the only thing that wants it,
// and it already opens on click, so it fetches its own. Held on the job object
// afterwards: the edit box here is the only writer.
async function openModal(job) {
  const backdrop = document.getElementById('modalBackdrop');
  const panel = document.getElementById('modalPanel');
  panel.innerHTML = '';
  backdrop.classList.remove('hidden');

  if (typeof job.job_summary !== 'string') {
    panel.textContent = 'Loading…';
    try {
      const params = new URLSearchParams({
        company: job.company || '',
        date_added: job.date_added || '',
        position_title: job.position_title || '',
        link: job.link || '',
      });
      const res = await fetch('/api/jobs/detail?' + params.toString());
      const data = await res.json();
      job.job_summary = data.job_summary || '';
    } catch (err) {
      job.job_summary = '';
    }
    if (backdrop.classList.contains('hidden')) return;  // closed while loading
    panel.innerHTML = '';
  }

  panel.appendChild(buildModalContent(job));
  refreshMarkdownFields(panel);
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.add('hidden');
}

function buildModalContent(job) {
  const frag = document.createDocumentFragment();

  const head = document.createElement('div');
  head.className = 'modal-head';

  const titleBlock = document.createElement('div');
  const companyRow = document.createElement('div');
  companyRow.className = 'company-row';

  const companyEditable = document.createElement('h2');
  companyEditable.className = 'company-editable';
  companyEditable.contentEditable = 'true';
  companyEditable.textContent = job.company;
  companyEditable.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      companyEditable.blur();
    }
  });
  companyEditable.addEventListener('blur', () => {
    const value = companyEditable.textContent.trim();
    if (!value) {
      companyEditable.textContent = job.company;
      return;
    }
    if (value !== job.company) {
      saveField(job, 'company', value, companyEditable).then((ok) => {
        if (ok) {
          render();
          closeModal();
        }
      });
    }
  });
  companyRow.appendChild(companyEditable);

  if (job.link) {
    const a = document.createElement('a');
    a.className = 'company-link-icon';
    a.href = job.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = '↗';
    a.title = job.link;
    companyRow.appendChild(a);
  }
  titleBlock.appendChild(companyRow);

  const subtitle = document.createElement('div');
  subtitle.className = 'modal-subtitle';
  subtitle.textContent = [job.position_title, job.location, job.date_added].filter(Boolean).join(' · ');
  titleBlock.appendChild(subtitle);
  head.appendChild(titleBlock);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.innerHTML = '&times;';
  closeBtn.addEventListener('click', closeModal);
  head.appendChild(closeBtn);

  frag.appendChild(head);

  frag.appendChild(buildModalStatusField(job));
  frag.appendChild(buildModalTextField('Contacts', job, 'contacts'));
  frag.appendChild(buildModalDateField('Outreach Date', job, 'outreach_date'));
  frag.appendChild(buildModalDateField('Date Applied', job, 'date_applied'));
  frag.appendChild(buildModalFollowupField('Follow-up Log', job, 'followup_log'));
  frag.appendChild(buildModalMarkdownField('Job Description', job, 'job_summary'));
  frag.appendChild(buildModalMarkdownField('Notes', job, 'notes'));
  frag.appendChild(buildDeleteField(job));

  return frag;
}

function buildDeleteField(job) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-field';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'delete-job-btn';
  btn.textContent = 'Delete Job';
  btn.addEventListener('click', () => deleteJob(job));
  wrap.appendChild(btn);
  return wrap;
}

function isValidISODate(str) {
  if (!str) return false;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str)) return false;
  return !isNaN(Date.parse(str));
}

function parseFollowupLog(raw) {
  return (raw || '').split(',').map(s => s.trim()).filter(Boolean);
}

function serializeFollowupLog(tokens) {
  return tokens.join(', ');
}

function buildModalDateField(label, job, field) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-field';

  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  wrap.appendChild(labelEl);

  wrap.appendChild(renderModalDateInput(job, field));

  return wrap;
}

function renderModalDateInput(job, field) {
  const value = job[field] || '';

  if (value && !isValidISODate(value)) {
    const box = document.createElement('div');
    box.className = 'non-date-value';
    const text = document.createElement('span');
    text.className = 'raw-text';
    text.textContent = value;
    box.appendChild(text);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Replace with date';
    btn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'date';
      input.dataset.field = field;
      input.addEventListener('change', () => {
        saveField(job, field, input.value, input).then(() => render());
      });
      box.replaceWith(input);
    });
    box.appendChild(btn);
    return box;
  }

  const input = document.createElement('input');
  input.type = 'date';
  input.value = value;
  input.dataset.field = field;
  input.addEventListener('change', () => {
    saveField(job, field, input.value, input).then(() => render());
  });
  return input;
}

function buildModalFollowupField(label, job, field) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-field';

  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  wrap.appendChild(labelEl);

  wrap.appendChild(renderModalFollowupField(job, field));

  return wrap;
}

function renderModalFollowupField(job, field) {
  const tokens = parseFollowupLog(job[field]);

  const box = document.createElement('div');
  box.className = 'followup-field';

  for (const token of tokens) {
    const chip = document.createElement('span');
    chip.className = 'followup-chip' + (isValidISODate(token) ? '' : ' non-date');
    const text = document.createElement('span');
    text.textContent = token;
    chip.appendChild(text);

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.innerHTML = '&times;';
    removeBtn.addEventListener('click', () => {
      const updated = tokens.filter(t => t !== token);
      const value = serializeFollowupLog(updated);
      saveField(job, field, value, chip).then(() => {
        const fresh = renderModalFollowupField(job, field);
        box.replaceWith(fresh);
      });
    });
    chip.appendChild(removeBtn);
    box.appendChild(chip);
  }

  const addWrap = document.createElement('span');
  addWrap.className = 'followup-add';
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  addWrap.appendChild(dateInput);

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.textContent = 'Add';
  addBtn.disabled = tokens.length >= 2;
  addBtn.addEventListener('click', () => {
    if (!dateInput.value || tokens.includes(dateInput.value)) return;
    const updated = [...tokens, dateInput.value];
    const value = serializeFollowupLog(updated);
    saveField(job, field, value, addWrap).then(() => {
      const fresh = renderModalFollowupField(job, field);
      box.replaceWith(fresh);
    });
  });
  addWrap.appendChild(addBtn);
  box.appendChild(addWrap);

  return box;
}

function buildModalStatusField(job) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-field';
  const label = document.createElement('label');
  label.textContent = 'Status';
  wrap.appendChild(label);

  const select = document.createElement('select');
  for (const s of STATUS_VALUES) {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s || '(none)';
    if (s === (job.status || '')) opt.selected = true;
    select.appendChild(opt);
  }
  select.addEventListener('change', () => {
    saveField(job, 'status', select.value, select).then(() => {
      render();
      const panel = document.getElementById('modalPanel');
      const dateInput = panel && panel.querySelector('input[data-field="date_applied"]');
      if (dateInput) dateInput.value = job.date_applied || '';
    });
  });
  wrap.appendChild(select);
  return wrap;
}

function buildModalTextField(label, job, field, isNotes) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-field';

  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  wrap.appendChild(labelEl);

  const editable = document.createElement('div');
  editable.className = 'editable';
  editable.dataset.field = field;
  editable.contentEditable = 'true';
  editable.textContent = job[field] || '';
  editable.addEventListener('blur', () => {
    const value = editable.textContent.trim();
    if (value !== (job[field] || '')) {
      saveField(job, field, value, editable);
    }
  });
  wrap.appendChild(editable);

  return wrap;
}

function buildModalMarkdownField(label, job, field) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-field markdown-field';

  const headerRow = document.createElement('div');
  headerRow.className = 'markdown-field-header';
  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  headerRow.appendChild(labelEl);
  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'linklike';
  editBtn.textContent = 'Edit';
  headerRow.appendChild(editBtn);
  wrap.appendChild(headerRow);

  const rendered = document.createElement('div');
  rendered.className = 'editable markdown-rendered';
  rendered.dataset.field = field;
  renderMarkdownInto(rendered, job[field]);
  wrap.appendChild(rendered);

  const expandBtn = document.createElement('button');
  expandBtn.type = 'button';
  expandBtn.className = 'linklike markdown-expand-btn';
  expandBtn.textContent = 'Show more';
  expandBtn.style.display = 'none';
  expandBtn.addEventListener('click', () => {
    const expanded = rendered.classList.toggle('expanded');
    expandBtn.textContent = expanded ? 'Show less' : 'Show more';
  });
  wrap.appendChild(expandBtn);

  wrap._checkOverflow = () => checkMarkdownOverflow(rendered, expandBtn);

  editBtn.addEventListener('click', () => {
    const textarea = document.createElement('textarea');
    textarea.className = 'editable markdown-raw';
    textarea.dataset.field = field;
    textarea.value = job[field] || '';
    textarea.addEventListener('blur', () => {
      const value = textarea.value.trim();
      const finish = () => {
        const fresh = document.createElement('div');
        fresh.className = 'editable markdown-rendered';
        fresh.dataset.field = field;
        renderMarkdownInto(fresh, job[field]);
        textarea.replaceWith(fresh);
        expandBtn.textContent = 'Show more';
        wrap._checkOverflow = () => checkMarkdownOverflow(fresh, expandBtn);
        wrap._checkOverflow();
      };
      if (value !== (job[field] || '')) {
        saveField(job, field, value, textarea).then(finish);
      } else {
        finish();
      }
    });
    expandBtn.style.display = 'none';
    rendered.replaceWith(textarea);
    textarea.focus();
  });

  return wrap;
}

async function saveField(job, field, value, cell) {
  const res = await fetch('/api/jobs/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      company: job.company,
      date_added: job.date_added,
      position_title: job.position_title,
      link: job.link,
      field,
      value,
    }),
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (res.ok) {
    job[field] = value;
    if (data.date_applied !== undefined) job.date_applied = data.date_applied;
    cell.classList.remove('saved-flash');
    void cell.offsetWidth;
    cell.classList.add('saved-flash');
  } else {
    alert(data.error || 'Failed to save change.');
    if (cell && cell.isContentEditable) {
      cell.textContent = job[field] || '';
    }
  }
  return res.ok;
}

async function deleteJob(job) {
  if (!confirm(`Delete the tracked job for ${job.company}${job.position_title ? ' — ' + job.position_title : ''}? This cannot be undone.`)) {
    return;
  }
  const res = await fetch('/api/jobs/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ company: job.company, date_added: job.date_added, position_title: job.position_title, link: job.link }),
  });
  if (res.ok) {
    allJobs = allJobs.filter(j => rowKey(j) !== rowKey(job));
    closeModal();
    render();
  } else {
    let data = {};
    try { data = await res.json(); } catch (e) { /* no body */ }
    alert(data.error || 'Failed to delete job.');
  }
}

function addDropHandlers(body) {
  body.addEventListener('dragover', (e) => {
    e.preventDefault();
    body.classList.add('drag-over');
  });
  body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
  body.addEventListener('drop', async (e) => {
    e.preventDefault();
    body.classList.remove('drag-over');
    const key = e.dataTransfer.getData('text/plain');
    const job = allJobs.find(j => rowKey(j) === key);
    if (!job) return;
    const newStatus = body.dataset.status;
    if ((job.status || '') === newStatus) return;

    const res = await fetch('/api/jobs/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        company: job.company,
        date_added: job.date_added,
        position_title: job.position_title,
        link: job.link,
        field: 'status',
        value: newStatus,
      }),
    });
    if (res.ok) {
      job.status = newStatus;
      render();
    } else {
      alert('Failed to move card.');
    }
  });
}

function openAddJobModal() {
  const backdrop = document.getElementById('modalBackdrop');
  const panel = document.getElementById('modalPanel');
  panel.innerHTML = '';
  panel.appendChild(buildAddJobModalContent());
  backdrop.classList.remove('hidden');
  document.getElementById('addCompany').focus();
}

function buildAddJobModalContent() {
  const frag = document.createDocumentFragment();

  const head = document.createElement('div');
  head.className = 'modal-head';
  const h2 = document.createElement('h2');
  h2.textContent = 'Add Job';
  head.appendChild(h2);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.innerHTML = '&times;';
  closeBtn.addEventListener('click', closeModal);
  head.appendChild(closeBtn);
  frag.appendChild(head);

  const errorEl = document.createElement('div');
  errorEl.className = 'modal-error';
  errorEl.id = 'addJobError';
  frag.appendChild(errorEl);

  const urlWrap = document.createElement('div');
  urlWrap.className = 'modal-field';
  const urlLabel = document.createElement('label');
  urlLabel.textContent = 'Job URL';
  urlWrap.appendChild(urlLabel);
  const urlRow = document.createElement('div');
  urlRow.style.display = 'flex';
  urlRow.style.gap = '8px';
  const urlInput = document.createElement('input');
  urlInput.type = 'text';
  urlInput.id = 'fetchUrl';
  urlInput.placeholder = 'Paste a job posting URL...';
  urlRow.appendChild(urlInput);
  const fetchBtn = document.createElement('button');
  fetchBtn.className = 'linklike';
  fetchBtn.id = 'fetchUrlBtn';
  fetchBtn.textContent = 'Fetch';
  fetchBtn.addEventListener('click', fetchJobUrl);
  urlRow.appendChild(fetchBtn);
  urlWrap.appendChild(urlRow);
  frag.appendChild(urlWrap);

  const fields = [
    { id: 'addCompany', label: 'Company *' },
    { id: 'addTitle', label: 'Position Title *' },
    { id: 'addLocation', label: 'Location' },
    { id: 'addLink', label: 'Link' },
    { id: 'addContacts', label: 'Contacts' },
  ];
  for (const f of fields) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-field';
    const label = document.createElement('label');
    label.textContent = f.label;
    wrap.appendChild(label);
    const input = document.createElement('input');
    input.type = 'text';
    input.id = f.id;
    wrap.appendChild(input);
    frag.appendChild(wrap);
  }

  const statusWrap = document.createElement('div');
  statusWrap.className = 'modal-field';
  const statusLabel = document.createElement('label');
  statusLabel.textContent = 'Status';
  statusWrap.appendChild(statusLabel);
  const select = document.createElement('select');
  select.id = 'addStatus';
  for (const s of STATUS_VALUES) {
    if (!s) continue;
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    if (s === 'Tracking') opt.selected = true;
    select.appendChild(opt);
  }
  statusWrap.appendChild(select);
  frag.appendChild(statusWrap);

  for (const f of [{ id: 'addSummary', label: 'Job Summary' }, { id: 'addNotes', label: 'Notes' }]) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-field';
    const label = document.createElement('label');
    label.textContent = f.label;
    wrap.appendChild(label);
    const editable = document.createElement('div');
    editable.className = 'editable';
    editable.id = f.id;
    editable.contentEditable = 'true';
    wrap.appendChild(editable);
    frag.appendChild(wrap);
  }

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'primary';
  submitBtn.textContent = 'Add Job';
  submitBtn.addEventListener('click', () => submitAddJob(submitBtn));
  actions.appendChild(submitBtn);
  frag.appendChild(actions);

  return frag;
}

async function fetchJobUrl() {
  const errorEl = document.getElementById('addJobError');
  errorEl.style.display = 'none';
  const url = document.getElementById('fetchUrl').value.trim();
  if (!url) return;

  const btn = document.getElementById('fetchUrlBtn');
  btn.disabled = true;
  btn.textContent = 'Fetching...';
  try {
    const res = await fetch('/api/jobs/fetch_url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Failed to fetch job posting.';
      errorEl.style.display = 'block';
      return;
    }
    document.getElementById('addCompany').value = data.company || '';
    document.getElementById('addTitle').value = data.position_title || '';
    document.getElementById('addLocation').value = data.location || '';
    document.getElementById('addLink').value = data.link || '';
    document.getElementById('addSummary').textContent = data.job_summary || '';
    document.getElementById('addNotes').textContent = data.notes || '';
  } catch (err) {
    errorEl.textContent = 'Failed to fetch job posting — check the server logs.';
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Fetch';
  }
}

async function submitAddJob(submitBtn) {
  const errorEl = document.getElementById('addJobError');
  errorEl.style.display = 'none';

  const company = document.getElementById('addCompany').value.trim();
  const position_title = document.getElementById('addTitle').value.trim();

  if (!company || !position_title) {
    errorEl.textContent = 'Company and Position Title are required.';
    errorEl.style.display = 'block';
    return;
  }

  const payload = {
    company,
    position_title,
    location: document.getElementById('addLocation').value.trim(),
    link: document.getElementById('addLink').value.trim(),
    status: document.getElementById('addStatus').value,
    contacts: document.getElementById('addContacts').value.trim(),
    job_summary: document.getElementById('addSummary').textContent.trim(),
    notes: document.getElementById('addNotes').textContent.trim(),
  };

  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/jobs/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Failed to add job.';
      errorEl.style.display = 'block';
      return;
    }
    allJobs.unshift(data);
    render();
    closeModal();
  } catch (err) {
    errorEl.textContent = 'Failed to add job — check the server logs.';
    errorEl.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
  }
}

document.getElementById('addJobBtn').addEventListener('click', openAddJobModal);

  if (e.target.id === 'modalBackdrop') closeModal();
});
document.addEventListener('keydown', (e) => {

loadJobs();
