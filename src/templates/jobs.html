<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Tracker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e2e2e6;
    --text: #1d1d1f;
    --muted: #6b6b74;
    --accent: #3457d5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card: #1f1f24;
      --border: #303038;
      --text: #eaeaef;
      --muted: #9a9aa5;
      --accent: #6f8dff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .stats { color: var(--muted); font-size: 13px; }
  .goal-badge { color: var(--muted); font-size: 13px; }
  .goal-badge.goal-met { color: #2e9e4f; font-weight: 600; }
  nav.view-nav { display: flex; gap: 4px; }
  nav.view-nav a {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    text-decoration: none;
    color: var(--muted);
  }
  nav.view-nav a.active { background: var(--accent); color: #fff; }
  nav.view-nav a:not(.active):hover { background: var(--bg); }
  .controls {
    padding: 14px 28px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  input[type="search"], input[type="date"], select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
  }
  input[type="search"] { flex: 1; min-width: 200px; }
  .date-filter { display: flex; align-items: center; gap: 6px; }
  .date-filter span { color: var(--muted); font-size: 13px; }
  button.linklike {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 7px 4px;
  }
  main { padding: 20px 28px 60px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    vertical-align: top;
  }
  th {
    background: var(--bg);
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.03em;
    position: sticky;
    top: 0;
  }
  tr.job-row { cursor: pointer; }
  tr.job-row:hover { background: var(--bg); }
  tr.detail-row td { background: var(--bg); cursor: default; }
  tr.detail-row.collapsed { display: none; }
  tr:last-child td, tr.detail-row:last-child td { border-bottom: none; }
  a.company-link { color: var(--accent); text-decoration: none; font-weight: 600; }
  a.company-link:hover { text-decoration: underline; }
  .company-cell { display: flex; align-items: center; gap: 6px; }
  .company-editable {
    font-weight: 600;
    cursor: text;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .company-editable:hover { outline: 1px dashed var(--accent); }
  .company-editable[contenteditable="true"]:focus { outline: 2px solid var(--accent); }
  a.company-link-icon { color: var(--accent); text-decoration: none; }
  a.company-link-icon:hover { text-decoration: underline; }
  .delete-job-btn {
    align-self: flex-start;
    background: none;
    border: 1px solid #d9534f;
    color: #d9534f;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .delete-job-btn:hover { background: #d9534f; color: #fff; }
  .caret {
    display: inline-block;
    width: 14px;
    color: var(--muted);
    transition: transform 0.15s ease;
    transform: rotate(-90deg);
  }
  tr.job-row.expanded .caret { transform: rotate(0deg); }
  td.editable { cursor: text; min-width: 120px; }
  td.editable:hover { outline: 1px dashed var(--accent); outline-offset: -2px; }
  td.editable[contenteditable="true"] { outline: 2px solid var(--accent); outline-offset: -2px; }
  select.status-select { width: 100%; font-size: 13px; }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(160px, 1fr));
    gap: 14px;
    padding: 4px 0 12px;
  }
  .detail-field { display: flex; flex-direction: column; gap: 4px; }
  .detail-field label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .detail-field .editable {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--card);
    min-height: 16px;
  }
  .detail-field.notes-field { grid-column: 1 / -1; }
  .detail-field.notes-field .editable {
    white-space: pre-wrap;
    min-height: 80px;
    max-height: 320px;
    overflow-y: auto;
  }
  .saved-flash { animation: flash 0.6s ease; }
  @keyframes flash { from { background: #d9f5df; } to { background: transparent; } }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .markdown-field-header { display: flex; justify-content: space-between; align-items: center; }
  .markdown-rendered { white-space: normal; line-height: 1.4; }
  .markdown-rendered p { margin: 0 0 8px; }
  .markdown-rendered p:last-child { margin-bottom: 0; }
  .markdown-rendered ul { margin: 0 0 8px; padding-left: 20px; }
  .markdown-rendered h4 { margin: 10px 0 4px; font-size: 13px; }
  .markdown-rendered code { background: rgba(127,127,127,0.15); padding: 1px 4px; border-radius: 3px; }
  .detail-field.notes-field .editable.markdown-rendered:not(.expanded) {
    max-height: 4.2em;
    overflow: hidden;
    position: relative;
  }
  .detail-field.notes-field .editable.markdown-rendered:not(.expanded)::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 1.4em;
    background: linear-gradient(to bottom, transparent, var(--card));
  }
  .markdown-expand-btn { align-self: flex-start; padding-left: 0; }
  textarea.markdown-raw {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--card);
    color: var(--text);
  }

  .detail-field input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 9px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    width: 100%;
  }
  .non-date-value {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--card);
    font-size: 13px;
  }
  .non-date-value .raw-text { flex: 1; color: var(--text); }
  .non-date-value button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--accent);
    font-size: 11px;
    padding: 3px 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .non-date-value button:hover { background: var(--bg); }
  .followup-field {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .followup-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 6px 3px 10px;
    font-size: 12px;
  }
  .followup-chip.non-date { color: var(--muted); font-style: italic; }
  .followup-chip button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 999px;
  }
  .followup-chip button:hover { background: var(--bg); color: var(--text); }
  .followup-add {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .followup-add input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    background: var(--card);
    color: var(--text);
    font-size: 12px;
  }
  .followup-add button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--accent);
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
  }
  .followup-add button:hover { background: var(--bg); }
  .followup-add button:disabled { opacity: 0.4; cursor: not-allowed; }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button.primary:hover { opacity: 0.9; }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  .modal-backdrop.hidden { display: none; }
  .modal-panel {
    background: var(--card);
    border-radius: 12px;
    width: 100%;
    max-width: 520px;
    max-height: calc(100vh - 80px);
    overflow-y: auto;
    padding: 20px 22px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .modal-head h2 { font-size: 16px; margin: 0; }
  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .modal-close:hover { background: var(--bg); color: var(--text); }
  .modal-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .modal-field label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .modal-field input[type="text"], .modal-field input[type="date"], .modal-field select, .modal-field textarea {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  .modal-field textarea { min-height: 80px; resize: vertical; }
  .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .interviews-field { grid-column: 1 / -1; }
  .interview-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .interview-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    font-size: 13px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
  }
  .interview-empty { font-size: 13px; color: var(--muted); }
  .interview-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .interview-form input, .interview-form select {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); color: var(--text); font-size: 13px;
  }
  .interview-error { color: #d64545; font-size: 12px; margin-top: 6px; }
  .funnel-banner {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 28px; font-size: 13px;
    background: var(--card); border-bottom: 1px solid var(--border); color: var(--text);
  }
  .funnel-banner a { color: var(--accent); margin-left: auto; }
  .funnel-banner .muted-inline { color: var(--muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .modal-error { color: #d64545; font-size: 12px; margin-bottom: 10px; display: none; }
</style>
</head>
<body>
<header>
  <h1>Job Tracker</h1>
  <nav class="view-nav">
    <a href="/" class="active">Table</a>
    <a href="/kanban">Kanban</a>
    <a href="/insights">Insights</a>
  </nav>
  <div class="stats" id="stats"></div>
  <div class="goal-badge" id="goalBadge"></div>
</header>
<div class="controls">
  <input type="search" id="search" placeholder="Search company, title, notes…">
  <select id="statusFilter">
    <option value="">All statuses</option>
    {% for s in status_values %}
      {% if s %}<option value="{{ s }}">{{ s }}</option>{% endif %}
    {% endfor %}
    <option value="__blank__">(no status)</option>
  </select>
  <div class="date-filter">
    <input type="date" id="dateFrom" title="Added from">
    <span>–</span>
    <input type="date" id="dateTo" title="Added to">
    <button class="linklike" id="filterToday">Today</button>
    <button class="linklike" id="filterWeek">This Week</button>
    <button class="linklike" id="filterClearDates">Clear</button>
  </div>
  <button class="linklike" id="expandAll">Expand all</button>
  <button class="linklike" id="collapseAll">Collapse all</button>
  <button class="linklike" id="exportCsvBtn">Export CSV</button>
  <button class="primary" id="addJobBtn">+ Add Job</button>
</div>

<div class="modal-backdrop hidden" id="addJobBackdrop">
  <div class="modal-panel">
    <div class="modal-head">
      <h2>Add Job</h2>
      <button class="modal-close" id="addJobClose">&times;</button>
    </div>
    <div class="modal-error" id="addJobError"></div>
    <div class="modal-field">
      <label>Job URL</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="fetchUrl" placeholder="Paste a job posting URL...">
        <button class="linklike" id="fetchUrlBtn">Fetch</button>
      </div>
    </div>
    <div class="modal-field">
      <label>Company *</label>
      <input type="text" id="addCompany">
    </div>
    <div class="modal-field">
      <label>Position Title *</label>
      <input type="text" id="addTitle">
    </div>
    <div class="modal-field">
      <label>Location</label>
      <input type="text" id="addLocation">
    </div>
    <div class="modal-field">
      <label>Link</label>
      <input type="text" id="addLink">
    </div>
    <div class="modal-field">
      <label>Status</label>
      <select id="addStatus">
        {% for s in status_values %}
          {% if s %}<option value="{{ s }}" {% if s == 'Tracking' %}selected{% endif %}>{{ s }}</option>{% endif %}
        {% endfor %}
      </select>
    </div>
    <div class="modal-field">
      <label>Contacts</label>
      <input type="text" id="addContacts">
    </div>
    <div class="modal-field">
      <label>Job Summary</label>
      <textarea id="addSummary"></textarea>
    </div>
    <div class="modal-field">
      <label>Notes</label>
      <textarea id="addNotes"></textarea>
    </div>
    <div class="modal-actions">
      <button class="linklike" id="addJobCancel">Cancel</button>
      <button class="primary" id="addJobSubmit">Add Job</button>
    </div>
  </div>
</div>
<main>
  <table id="jobsTable">
    <thead>
      <tr>
        <th style="width:20px;"></th>
        <th>Company</th>
        <th>Title</th>
        <th>Location</th>
        <th>Date Added</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="jobsBody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none;">No jobs match your filters.</div>
</main>

<script>
const STATUS_VALUES = {{ status_values | tojson }};
let allJobs = [];

async function loadJobs() {
  // Arriving from the Insights funnel means matching the population it counted,
  // archived rows included; otherwise this stays the working table.
  const fromFunnel = new URLSearchParams(window.location.search).has('stage');
  const res = await fetch('/api/jobs' + (fromFunnel ? '?include_archived=1' : ''));
  allJobs = await res.json();
  render();
}

function rowKey(job) {
  return `${job.company}::${job.date_added}::${job.position_title || ''}::${job.link || ''}`;
}

function localISODate(d) {
  const yr = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const da = String(d.getDate()).padStart(2, '0');
  return `${yr}-${mo}-${da}`;
}

function startOfWeekISO(d) {
  const copy = new Date(d);
  copy.setDate(copy.getDate() - copy.getDay());
  return localISODate(copy);
}

function renderMarkdownInto(container, raw) {
  container.innerHTML = '';
  const lines = (raw || '').split('\n');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*$/.test(line)) { i++; continue; }
    const heading = /^#{1,6}\s+(.*)$/.exec(line);
    if (heading) {
      const h = document.createElement('h4');
      appendInlineMarkdown(h, heading[1]);
      container.appendChild(h);
      i++;
      continue;
    }
    if (/^[-*]\s+/.test(line)) {
      const ul = document.createElement('ul');
      while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
        const li = document.createElement('li');
        appendInlineMarkdown(li, lines[i].replace(/^[-*]\s+/, ''));
        ul.appendChild(li);
        i++;
      }
      container.appendChild(ul);
      continue;
    }
    const para = document.createElement('p');
    let first = true;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^[-*]\s+/.test(lines[i]) && !/^#{1,6}\s+/.test(lines[i])) {
      if (!first) para.appendChild(document.createElement('br'));
      appendInlineMarkdown(para, lines[i]);
      first = false;
      i++;
    }
    container.appendChild(para);
  }
  if (!container.childNodes.length) {
    const empty = document.createElement('p');
    empty.className = 'markdown-empty';
    empty.textContent = '(empty)';
    container.appendChild(empty);
  }
}

function appendInlineMarkdown(parent, text) {
  const tokenRe = /(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)]+\))/g;
  let lastIndex = 0;
  let m;
  while ((m = tokenRe.exec(text)) !== null) {
    if (m.index > lastIndex) parent.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
    const token = m[0];
    if (token.startsWith('**')) {
      const strong = document.createElement('strong');
      strong.textContent = token.slice(2, -2);
      parent.appendChild(strong);
    } else if (token.startsWith('`')) {
      const code = document.createElement('code');
      code.textContent = token.slice(1, -1);
      parent.appendChild(code);
    } else {
      const linkMatch = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(token);
      if (linkMatch && /^https?:\/\//i.test(linkMatch[2])) {
        const a = document.createElement('a');
        a.href = linkMatch[2];
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = linkMatch[1];
        parent.appendChild(a);
      } else {
        parent.appendChild(document.createTextNode(token));
      }
    }
    lastIndex = tokenRe.lastIndex;
  }
  if (lastIndex < text.length) parent.appendChild(document.createTextNode(text.slice(lastIndex)));
}

function checkMarkdownOverflow(rendered, expandBtn) {
  if (rendered.classList.contains('expanded')) { return; }
  const overflowing = rendered.scrollHeight > rendered.clientHeight + 1;
  expandBtn.style.display = overflowing ? 'inline-block' : 'none';
}

function refreshMarkdownFields(scope) {
  scope.querySelectorAll('.markdown-field').forEach(el => {
    if (typeof el._checkOverflow === 'function') el._checkOverflow();
  });
}

function updateGoalBadge() {
  const DAILY_GOAL = 5;
  const todayStr = localISODate(new Date());
  const appliedToday = allJobs.filter(j => j.status === 'Applied' && (j.date_applied || '') === todayStr).length;
  const goalBadge = document.getElementById('goalBadge');
  goalBadge.textContent = `Applied today: ${appliedToday} / ${DAILY_GOAL}`;
  goalBadge.classList.toggle('goal-met', appliedToday >= DAILY_GOAL);
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const statusFilter = document.getElementById('statusFilter').value;
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;

  const filtered = allJobs.filter(j => {
    if (statusFilter === '__blank__' && (j.status || '').trim() !== '') return false;
    if (statusFilter && statusFilter !== '__blank__' && j.status !== statusFilter) return false;
    if (!matchesFunnelFilter(j)) return false;
    if (dateFrom && (j.date_added || '') < dateFrom) return false;
    if (dateTo && (j.date_added || '') > dateTo) return false;
    if (!q) return true;
    const haystack = [j.company, j.position_title, j.notes, j.location].join(' ').toLowerCase();
    return haystack.includes(q);
  });

  document.getElementById('stats').textContent = `${filtered.length} of ${allJobs.length} jobs`;
  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';

  updateGoalBadge();

  const tbody = document.getElementById('jobsBody');
  tbody.innerHTML = '';

  for (const job of filtered) {
    const key = rowKey(job);

    const mainRow = document.createElement('tr');
    mainRow.className = 'job-row';
    mainRow.dataset.key = key;

    const caretTd = document.createElement('td');
    caretTd.innerHTML = '<span class="caret">▾</span>';
    mainRow.appendChild(caretTd);

    mainRow.appendChild(makeCompanyCell(job));

    mainRow.appendChild(makeCell(job.position_title));
    mainRow.appendChild(makeCell(job.location));
    mainRow.appendChild(makeCell(job.date_added));

    const statusTd = makeStatusCell(job);
    statusTd.addEventListener('click', (e) => e.stopPropagation());
    mainRow.appendChild(statusTd);

    const detailRow = document.createElement('tr');
    detailRow.className = 'detail-row collapsed';
    detailRow.dataset.key = key;
    const detailTd = document.createElement('td');
    detailTd.colSpan = 6;
    detailRow.appendChild(detailTd);

    // Left empty on purpose. Building the panel here is what made this page
    // fetch every job's interview rounds on load -- the row is only hidden by
    // CSS, so a builder that fetches runs for all of them. toggleRow is the
    // mount point now: nothing is built or fetched until a row is opened.
    mainRow.addEventListener('click', () => toggleRow(mainRow, detailRow, job, detailTd));

    tbody.appendChild(mainRow);
    tbody.appendChild(detailRow);
  }
}

async function toggleRow(mainRow, detailRow, job, detailTd) {
  const collapsed = detailRow.classList.toggle('collapsed');
  mainRow.classList.toggle('expanded', !collapsed);
  if (collapsed) return;

  detailTd.textContent = 'Loading…';
  let detail;
  try {
    detail = await fetchJobDetail(job);
  } catch (err) {
    detailTd.textContent = 'Failed to load — check the server logs.';
    return;
  }
  // Still open? A fast collapse-and-move-on should not repaint.
  if (detailRow.classList.contains('collapsed')) return;

  detailTd.textContent = '';
  detailTd.appendChild(buildDetailGrid(job, detail.interviews));
  refreshMarkdownFields(detailRow);
}

// job_summary is written in one place only -- the edit box in this panel -- so
// once it is on the job object it cannot go stale and is never re-requested.
// Interview rounds have a second writer, inbox-triage on a daily cron, so they
// are read fresh on every expand and deliberately not stored on the job.
async function fetchJobDetail(job) {
  const params = new URLSearchParams(jobKeyFields(job));
  const haveSummary = typeof job.job_summary === 'string';
  if (haveSummary) params.set('summary', '0');
  const res = await fetch('/api/jobs/detail?' + params.toString());
  if (!res.ok) throw new Error('detail fetch failed');
  const data = await res.json();
  if (!haveSummary) job.job_summary = data.job_summary || '';
  return data;
}

function buildDetailGrid(job, rounds) {
  const grid = document.createElement('div');
  grid.className = 'detail-grid';

  grid.appendChild(makeDetailField('Contacts', job, 'contacts'));
  grid.appendChild(makeDateField('Outreach Date', job, 'outreach_date'));
  grid.appendChild(makeDateField('Date Applied', job, 'date_applied'));
  grid.appendChild(makeFollowupField('Follow-up Log', job, 'followup_log'));
  grid.appendChild(makeMarkdownField('Job Description', job, 'job_summary'));
  grid.appendChild(makeMarkdownField('Notes', job, 'notes'));
  grid.appendChild(makeInterviewsField(job, rounds));
  grid.appendChild(makeDeleteField(job));

  return grid;
}

const INTERVIEW_TYPES = {{ interview_types|tojson }};

// The full composite key comes straight off the row the user opened, so an
// interview is always attached to one specific posting - never matched by
// company name, which is ambiguous for the companies you applied to twice.
function jobKeyFields(job) {
  return {
    company: job.company || '',
    date_added: job.date_added || '',
    position_title: job.position_title || '',
    link: job.link || '',
  };
}

// --- Funnel drill-through ---------------------------------------------------
// The Insights funnel links here with ?stage=&source=. Its stages are predicates
// over several fields, not single status values, so they cannot ride the existing
// status <select> - they filter alongside it.

const SCREEN_STATUSES = ['phone screen', 'technical', 'system design', 'behavioral', 'final round'];
const FUNNEL_FILTER = (() => {
  const p = new URLSearchParams(window.location.search);
  const stage = p.get('stage');
  const source = p.get('source') || 'all';
  return stage ? { stage, source } : null;
})();
let funnelInterviewedKeys = null;   // filled in only when the stage needs it

function isAutoApplied(j) {
  const n = (j.notes || '').toLowerCase();
  return n.includes('applypass') || n.includes('auto-appl');
}

function matchesFunnelFilter(j) {
  if (!FUNNEL_FILTER) return true;
  const { stage, source } = FUNNEL_FILTER;
  if (source === 'hand' && isAutoApplied(j)) return false;
  if (source === 'auto' && !isAutoApplied(j)) return false;

  const status = (j.status || '').trim().toLowerCase();
  switch (stage) {
    case 'applied':     return !!(j.date_applied || '').trim();
    case 'outreached':  return !!(j.outreach_date || '').trim();
    case 'screen':      return SCREEN_STATUSES.includes(status);
    case 'rejected':    return status === 'rejected';
    case 'interviewed':
      return funnelInterviewedKeys
        ? funnelInterviewedKeys.has(rowKey(j))
        : true;   // banner says "loading" until the fetch lands
    default:            return true;
  }
}

function showFunnelBanner() {
  if (!FUNNEL_FILTER) return;
  const labels = {
    applied: 'applied', outreached: 'outreached', screen: 'at an interview stage',
    rejected: 'rejected', interviewed: 'interviewed',
  };
  const sources = { all: 'all sources', hand: 'hand-applied', auto: 'auto-submitted (ApplyPass)' };
  const bar = document.createElement('div');
  bar.className = 'funnel-banner';
  const txt = document.createElement('span');
  txt.innerHTML = `Filtered from <strong>Insights</strong>: ` +
    `${labels[FUNNEL_FILTER.stage] || FUNNEL_FILTER.stage} &middot; ${sources[FUNNEL_FILTER.source] || FUNNEL_FILTER.source}` +
    ` &middot; <span class="muted-inline">archived included, to match the funnel</span>`;
  const clear = document.createElement('a');
  clear.href = '/';
  clear.textContent = 'clear';
  bar.appendChild(txt);
  bar.appendChild(clear);
  document.querySelector('main, body').prepend(bar);
}

async function hydrateFunnelFilter() {
  showFunnelBanner();
  if (FUNNEL_FILTER && FUNNEL_FILTER.stage === 'interviewed') {
    const rows = await (await fetch('/api/interviews')).json();
    funnelInterviewedKeys = new Set(rows.map(r => rowKey(r)));
    render();
  }
}

function makeInterviewsField(job, rounds) {
  const wrap = document.createElement('div');
  wrap.className = 'detail-field interviews-field';

  const label = document.createElement('label');
  label.textContent = 'Interview Rounds';
  wrap.appendChild(label);

  // Rounds arrive with the panel, so this renders synchronously -- no
  // placeholder, and no fetch reachable from a builder.
  const list = document.createElement('div');
  list.className = 'interview-list';
  wrap.appendChild(list);
  renderInterviews(job, list, rounds);

  const form = document.createElement('div');
  form.className = 'interview-form';

  const typeSel = document.createElement('select');
  for (const t of INTERVIEW_TYPES) {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t.replace(/_/g, ' ');
    typeSel.appendChild(opt);
  }

  const labelInput = document.createElement('input');
  labelInput.type = 'text';
  labelInput.placeholder = 'describe it';
  labelInput.style.display = 'none';
  typeSel.addEventListener('change', () => {
    labelInput.style.display = typeSel.value === 'other' ? '' : 'none';
  });

  // Which of the two dates this round carries. A round is booked or it is held,
  // never both -- the API rejects both set -- so this picks the field rather
  // than offering two date boxes that can contradict each other.
  const whenSel = document.createElement('select');
  whenSel.title = 'Whether this round has happened yet';
  for (const [v, t] of [['occurred', 'happened on'], ['scheduled', 'booked for']]) {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = t;
    whenSel.appendChild(opt);
  }

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.value = new Date().toISOString().slice(0, 10);
  const syncWhen = () => {
    const booked = whenSel.value === 'scheduled';
    dateInput.title = booked ? 'Date the round is booked for'
                             : 'Date the round actually happened';
    // A booked round is not an outcome yet, so there is nothing to rate.
    ratingSel.disabled = booked;
    if (booked) ratingSel.value = '';
    btn.textContent = booked ? 'Book Round' : 'Log Round';
  };
  whenSel.addEventListener('change', syncWhen);

  const ratingSel = document.createElement('select');
  ratingSel.title = 'How it felt (optional)';
  for (const r of ['', '1', '2', '3', '4', '5']) {
    const opt = document.createElement('option');
    opt.value = r;
    opt.textContent = r === '' ? 'rating —' : r;
    ratingSel.appendChild(opt);
  }

  const loopInput = document.createElement('input');
  loopInput.type = 'text';
  loopInput.placeholder = 'loop id (same onsite)';
  loopInput.title = 'Rounds sharing a loop id resolve together as one onsite';

  const notesInput = document.createElement('input');
  notesInput.type = 'text';
  notesInput.placeholder = 'notes';

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'primary';
  btn.textContent = 'Log Round';

  const err = document.createElement('div');
  err.className = 'interview-error';

  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    err.textContent = '';
    const body = Object.assign(jobKeyFields(job), {
      interview_type: typeSel.value,
      type_label: labelInput.value.trim(),
      occurred_date: whenSel.value === 'occurred' ? dateInput.value : '',
      scheduled_date: whenSel.value === 'scheduled' ? dateInput.value : '',
      self_rating: ratingSel.value,
      loop_id: loopInput.value.trim(),
      notes: notesInput.value.trim(),
    });
    const res = await fetch('/api/interviews/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Could not save that round.'; return; }
    loopInput.value = ''; notesInput.value = ''; ratingSel.value = ''; labelInput.value = '';
    reloadInterviews(job, list);
  });

  syncWhen();

  for (const el of [typeSel, labelInput, whenSel, dateInput, ratingSel, loopInput,
                    notesInput, btn]) {
    el.addEventListener('click', (e) => e.stopPropagation());
    form.appendChild(el);
  }
  wrap.appendChild(form);
  wrap.appendChild(err);

  return wrap;
}

// Only after this panel writes a round. Reads the same detail endpoint the
// expand used, minus job_summary, so one job's rounds refresh without touching
// the table.
async function reloadInterviews(job, list) {
  const params = new URLSearchParams(jobKeyFields(job));
  params.set('summary', '0');
  const res = await fetch('/api/jobs/detail?' + params.toString());
  const data = await res.json();
  renderInterviews(job, list, data.interviews || []);
}

function renderInterviews(job, list, rounds) {
  list.innerHTML = '';
  if (!rounds.length) {
    list.innerHTML = '<span class="interview-empty">No rounds logged.</span>';
    return;
  }
  for (const r of rounds) {
    const row = document.createElement('div');
    row.className = 'interview-row';
    const type = r.interview_type === 'other' && r.type_label
      ? r.type_label : (r.interview_type || '').replace(/_/g, ' ');
    // A booked round has no occurred_date; showing a blank there reads as a bug.
    const bits = [r.occurred_date || ('booked ' + (r.scheduled_date || '?')), type];
    if (r.loop_id) bits.push('loop: ' + r.loop_id);
    if (r.self_rating) bits.push(r.self_rating + '/5');
    if (r.notes) bits.push(r.notes);
    const span = document.createElement('span');
    span.textContent = bits.join(' · ');
    row.appendChild(span);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'linklike';
    del.textContent = 'remove';
    del.addEventListener('click', async (e) => {
      e.stopPropagation();
      await fetch('/api/interviews/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: r.id}),
      });
      reloadInterviews(job, list);
    });
    row.appendChild(del);
    list.appendChild(row);
  }
}

function makeDeleteField(job) {
  const wrap = document.createElement('div');
  wrap.className = 'detail-field';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'delete-job-btn';
  btn.textContent = 'Delete Job';
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    deleteJob(job);
  });
  wrap.appendChild(btn);
  return wrap;
}

function isValidISODate(str) {
  if (!str) return false;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str)) return false;
  return !isNaN(Date.parse(str));
}

function parseFollowupLog(raw) {
  return (raw || '').split(',').map(s => s.trim()).filter(Boolean);
}

function serializeFollowupLog(tokens) {
  return tokens.join(', ');
}

function makeDateField(label, job, field) {
  const wrap = document.createElement('div');
  wrap.className = 'detail-field';

  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  wrap.appendChild(labelEl);

  wrap.appendChild(renderDateInput(job, field));

  return wrap;
}

function renderDateInput(job, field) {
  const value = job[field] || '';

  if (value && !isValidISODate(value)) {
    const box = document.createElement('div');
    box.className = 'non-date-value';
    const text = document.createElement('span');
    text.className = 'raw-text';
    text.textContent = value;
    box.appendChild(text);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Replace with date';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const input = document.createElement('input');
      input.type = 'date';
      input.dataset.field = field;
      input.addEventListener('click', (ev) => ev.stopPropagation());
      input.addEventListener('change', () => {
        saveField(job, field, input.value, input).then(() => updateGoalBadge());
      });
      box.replaceWith(input);
    });
    box.appendChild(btn);
    return box;
  }

  const input = document.createElement('input');
  input.type = 'date';
  input.value = value;
  input.dataset.field = field;
  input.addEventListener('click', (e) => e.stopPropagation());
  input.addEventListener('change', () => {
    saveField(job, field, input.value, input).then(() => updateGoalBadge());
  });
  return input;
}

function makeFollowupField(label, job, field) {
  const wrap = document.createElement('div');
  wrap.className = 'detail-field';

  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  wrap.appendChild(labelEl);

  wrap.appendChild(renderFollowupField(job, field, wrap));

  return wrap;
}

function renderFollowupField(job, field, container) {
  const tokens = parseFollowupLog(job[field]);

  const box = document.createElement('div');
  box.className = 'followup-field';

  for (const token of tokens) {
    const chip = document.createElement('span');
    chip.className = 'followup-chip' + (isValidISODate(token) ? '' : ' non-date');
    const text = document.createElement('span');
    text.textContent = token;
    chip.appendChild(text);

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.innerHTML = '&times;';
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const updated = tokens.filter(t => t !== token);
      const value = serializeFollowupLog(updated);
      saveField(job, field, value, chip).then(() => {
        const fresh = renderFollowupField(job, field, container);
        box.replaceWith(fresh);
      });
    });
    chip.appendChild(removeBtn);
    box.appendChild(chip);
  }

  const addWrap = document.createElement('span');
  addWrap.className = 'followup-add';
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.addEventListener('click', (e) => e.stopPropagation());
  addWrap.appendChild(dateInput);

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.textContent = 'Add';
  addBtn.disabled = tokens.length >= 2;
  addBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!dateInput.value || tokens.includes(dateInput.value)) return;
    const updated = [...tokens, dateInput.value];
    const value = serializeFollowupLog(updated);
    saveField(job, field, value, addWrap).then(() => {
      const fresh = renderFollowupField(job, field, container);
      box.replaceWith(fresh);
    });
  });
  addWrap.appendChild(addBtn);
  box.appendChild(addWrap);

  return box;
}

function makeDetailField(label, job, field, isNotes) {
  const wrap = document.createElement('div');
  wrap.className = 'detail-field' + (isNotes ? ' notes-field' : '');

  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  wrap.appendChild(labelEl);

  const editable = document.createElement('div');
  editable.className = 'editable';
  editable.contentEditable = 'true';
  editable.textContent = job[field] || '';
  editable.addEventListener('click', (e) => e.stopPropagation());
  editable.addEventListener('blur', () => {
    const value = editable.textContent.trim();
    if (value !== (job[field] || '')) {
      saveField(job, field, value, editable);
    }
  });
  wrap.appendChild(editable);

  return wrap;
}

function makeMarkdownField(label, job, field) {
  const wrap = document.createElement('div');
  wrap.className = 'detail-field notes-field markdown-field';

  const headerRow = document.createElement('div');
  headerRow.className = 'markdown-field-header';
  const labelEl = document.createElement('label');
  labelEl.textContent = label;
  headerRow.appendChild(labelEl);
  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'linklike';
  editBtn.textContent = 'Edit';
  headerRow.appendChild(editBtn);
  wrap.appendChild(headerRow);

  const rendered = document.createElement('div');
  rendered.className = 'editable markdown-rendered';
  renderMarkdownInto(rendered, job[field]);
  rendered.addEventListener('click', (e) => e.stopPropagation());
  wrap.appendChild(rendered);

  const expandBtn = document.createElement('button');
  expandBtn.type = 'button';
  expandBtn.className = 'linklike markdown-expand-btn';
  expandBtn.textContent = 'Show more';
  expandBtn.style.display = 'none';
  expandBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const expanded = rendered.classList.toggle('expanded');
    expandBtn.textContent = expanded ? 'Show less' : 'Show more';
  });
  wrap.appendChild(expandBtn);

  wrap._checkOverflow = () => checkMarkdownOverflow(rendered, expandBtn);

  editBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const textarea = document.createElement('textarea');
    textarea.className = 'editable markdown-raw';
    textarea.value = job[field] || '';
    textarea.addEventListener('click', (ev) => ev.stopPropagation());
    textarea.addEventListener('blur', () => {
      const value = textarea.value.trim();
      const finish = () => {
        const fresh = document.createElement('div');
        fresh.className = 'editable markdown-rendered';
        renderMarkdownInto(fresh, job[field]);
        fresh.addEventListener('click', (ev) => ev.stopPropagation());
        textarea.replaceWith(fresh);
        expandBtn.textContent = 'Show more';
        wrap._checkOverflow = () => checkMarkdownOverflow(fresh, expandBtn);
        wrap._checkOverflow();
      };
      if (value !== (job[field] || '')) {
        saveField(job, field, value, textarea).then(finish);
      } else {
        finish();
      }
    });
    expandBtn.style.display = 'none';
    rendered.replaceWith(textarea);
    textarea.focus();
  });

  return wrap;
}

function makeCell(text) {
  const td = document.createElement('td');
  td.textContent = text || '';
  return td;
}

function makeCompanyCell(job) {
  const td = document.createElement('td');
  const wrap = document.createElement('div');
  wrap.className = 'company-cell';

  const editable = document.createElement('span');
  editable.className = 'editable company-editable';
  editable.contentEditable = 'true';
  editable.textContent = job.company;
  editable.addEventListener('click', (e) => e.stopPropagation());
  editable.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      editable.blur();
    }
  });
  editable.addEventListener('blur', () => {
    const value = editable.textContent.trim();
    if (!value) {
      editable.textContent = job.company;
      return;
    }
    if (value !== job.company) {
      saveField(job, 'company', value, editable).then((ok) => {
        if (ok) render();
      });
    }
  });
  wrap.appendChild(editable);

  if (job.link) {
    const a = document.createElement('a');
    a.href = job.link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'company-link-icon';
    a.textContent = '↗';
    a.title = job.link;
    a.addEventListener('click', (e) => e.stopPropagation());
    wrap.appendChild(a);
  }

  td.appendChild(wrap);
  return td;
}

function makeStatusCell(job) {
  const td = document.createElement('td');
  const select = document.createElement('select');
  select.className = 'status-select';
  for (const s of STATUS_VALUES) {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s || '(none)';
    if (s === (job.status || '')) opt.selected = true;
    select.appendChild(opt);
  }
  select.addEventListener('change', () => {
    saveField(job, 'status', select.value, td).then(() => {
      updateGoalBadge();
      const mainRow = td.closest('tr');
      const detailRow = mainRow && mainRow.nextElementSibling;
      const dateInput = detailRow && detailRow.querySelector('input[data-field="date_applied"]');
      if (dateInput) dateInput.value = job.date_applied || '';
    });
  });
  td.appendChild(select);
  return td;
}

async function saveField(job, field, value, cell) {
  const res = await fetch('/api/jobs/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      company: job.company,
      date_added: job.date_added,
      position_title: job.position_title,
      link: job.link,
      field,
      value,
    }),
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (res.ok) {
    job[field] = value;
    if (data.date_applied !== undefined) job.date_applied = data.date_applied;
    cell.classList.remove('saved-flash');
    void cell.offsetWidth;
    cell.classList.add('saved-flash');
  } else {
    alert(data.error || 'Failed to save change.');
    if (cell && cell.isContentEditable) {
      cell.textContent = job[field] || '';
    }
  }
  return res.ok;
}

async function deleteJob(job) {
  if (!confirm(`Delete the tracked job for ${job.company}${job.position_title ? ' — ' + job.position_title : ''}? This cannot be undone.`)) {
    return;
  }
  const res = await fetch('/api/jobs/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ company: job.company, date_added: job.date_added, position_title: job.position_title, link: job.link }),
  });
  if (res.ok) {
    allJobs = allJobs.filter(j => rowKey(j) !== rowKey(job));
    render();
  } else {
    let data = {};
    try { data = await res.json(); } catch (e) { /* no body */ }
    alert(data.error || 'Failed to delete job.');
  }
}

function openAddJobModal() {
  document.getElementById('addJobError').style.display = 'none';
  document.getElementById('addJobError').textContent = '';
  for (const id of ['fetchUrl', 'addCompany', 'addTitle', 'addLocation', 'addLink', 'addContacts', 'addSummary', 'addNotes']) {
    document.getElementById(id).value = '';
  }
  document.getElementById('addStatus').value = 'Tracking';
  document.getElementById('addJobBackdrop').classList.remove('hidden');
  document.getElementById('addCompany').focus();
}

function closeAddJobModal() {
  document.getElementById('addJobBackdrop').classList.add('hidden');
}

async function fetchJobUrl() {
  const errorEl = document.getElementById('addJobError');
  errorEl.style.display = 'none';
  const url = document.getElementById('fetchUrl').value.trim();
  if (!url) return;

  const btn = document.getElementById('fetchUrlBtn');
  btn.disabled = true;
  btn.textContent = 'Fetching...';
  try {
    const res = await fetch('/api/jobs/fetch_url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Failed to fetch job posting.';
      errorEl.style.display = 'block';
      return;
    }
    document.getElementById('addCompany').value = data.company || '';
    document.getElementById('addTitle').value = data.position_title || '';
    document.getElementById('addLocation').value = data.location || '';
    document.getElementById('addLink').value = data.link || '';
    document.getElementById('addSummary').value = data.job_summary || '';
    document.getElementById('addNotes').value = data.notes || '';
  } catch (err) {
    errorEl.textContent = 'Failed to fetch job posting — check the server logs.';
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Fetch';
  }
}

async function submitAddJob() {
  const errorEl = document.getElementById('addJobError');
  errorEl.style.display = 'none';

  const company = document.getElementById('addCompany').value.trim();
  const position_title = document.getElementById('addTitle').value.trim();

  if (!company || !position_title) {
    errorEl.textContent = 'Company and Position Title are required.';
    errorEl.style.display = 'block';
    return;
  }

  const payload = {
    company,
    position_title,
    location: document.getElementById('addLocation').value.trim(),
    link: document.getElementById('addLink').value.trim(),
    status: document.getElementById('addStatus').value,
    contacts: document.getElementById('addContacts').value.trim(),
    job_summary: document.getElementById('addSummary').value.trim(),
    notes: document.getElementById('addNotes').value.trim(),
  };

  const submitBtn = document.getElementById('addJobSubmit');
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/jobs/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || 'Failed to add job.';
      errorEl.style.display = 'block';
      return;
    }
    allJobs.unshift(data);
    render();
    closeAddJobModal();
  } catch (err) {
    errorEl.textContent = 'Failed to add job — check the server logs.';
    errorEl.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
  }
}

document.getElementById('addJobCancel').addEventListener('click', closeAddJobModal);
document.getElementById('addJobSubmit').addEventListener('click', submitAddJob);
document.getElementById('addJobBackdrop').addEventListener('click', (e) => {

document.getElementById('dateFrom').addEventListener('change', render);
document.getElementById('dateTo').addEventListener('change', render);

loadJobs().then(hydrateFunnelFilter);
